name: CI/CD

on:
  push:
    branches:
      - develop
      - main
      - test/cicd
  pull_request:
    branches:
      - develop
      - main
      - test/cicd
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/nguongocso-backend
  FRONTEND_IMAGE: ${{ github.repository_owner }}/nguongocso-frontend
  # TC-04: Semantic release version. Baked into build-info, OCI labels, K8s labels.
  RELEASE_VERSION: "1.0.0"

jobs:
  # ==========================================================
  # BACKEND - TEST
  # ==========================================================
  backend-test:
    name: Backend - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        env:
          SPRING_PROFILES_ACTIVE: test
        # -Dgit.commit bakes the real commit into build-info so the test suite
        # also verifies TC-04 traceability data (see BuildInfoActuatorTest).
        run: ./mvnw clean test -Dgit.commit=${{ github.sha }}

  # ==========================================================
  # FRONTEND - LINT + BUILD
  # ==========================================================
  frontend-build:
    name: Frontend - Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # ==========================================================
  # BUILD + PUSH IMAGES
  # ==========================================================
  build-push:
    name: Build & Push Images
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # TC-04: mutable convenience tags (latest/edge) are kept for humans,
      # but every push also receives an immutable commit-SHA tag which is
      # what production/staging deployments use.
      - name: Determine convenience image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Log build traceability (Git Commit -> Docker Image)
        run: |
          echo "Git Commit     : ${{ github.sha }}"
          echo "Backend image  : ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          echo "Frontend image : ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
  # ==========================================================
  # DEPLOY TO KUBERNETES
  # ==========================================================
  deploy:
    name: Deploy to Kubernetes
    needs: build-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Kubeconfig from secrets
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBECONFIG_B64}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Test Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # TC-04: deploy the immutable commit-SHA image (NOT latest/edge) so the
      # running container is traceable to the exact Git commit that produced it.
      # Also rewrite K8s labels (release-version, git-commit) for traceability.
      - name: Set immutable commit-SHA images + release labels (TC-04)
        run: |
          sed -i "s|image: ghcr.io/nguongocso/nguongocso-backend:.*|image: ghcr.io/nguongocso/nguongocso-backend:${{ github.sha }}|g" k8s/backend-deployment.yaml
          sed -i "s|image: ghcr.io/nguongocso/nguongocso-frontend:.*|image: ghcr.io/nguongocso/nguongocso-frontend:${{ github.sha }}|g" k8s/frontend-deployment.yaml
          sed -i "s|release-version: \".*\"|release-version: \"${{ env.RELEASE_VERSION }}\"|g" k8s/backend-deployment.yaml
          sed -i "s|git-commit: \".*\"|git-commit: \"${{ github.sha }}\"|g" k8s/backend-deployment.yaml
          sed -i "s|release-version: \".*\"|release-version: \"${{ env.RELEASE_VERSION }}\"|g" k8s/frontend-deployment.yaml
          sed -i "s|git-commit: \".*\"|git-commit: \"${{ github.sha }}\"|g" k8s/frontend-deployment.yaml

      - name: Apply Kubernetes manifests
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secrets.yaml -n "$NS"
          kubectl apply -f k8s/configmap.yaml -n "$NS"
          kubectl apply -f k8s/persistent-volumes.yaml -n "$NS"
          kubectl apply -f k8s/backend-service.yaml -n "$NS"
          kubectl apply -f k8s/backend-deployment.yaml -n "$NS"
          kubectl apply -f k8s/frontend-service.yaml -n "$NS"
          kubectl apply -f k8s/frontend-deployment.yaml -n "$NS"
          # Ingress is applied per-environment in a dedicated step below
          # (each namespace uses its own host via a separate manifest).

      - name: Set frontend NodePort per environment
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          if [ "$NS" = "production" ]; then
            PORT=31690
          else
            PORT=31691
          fi
          kubectl -n "$NS" patch svc frontend-service -p "{\"spec\":{\"ports\":[{\"port\":80,\"nodePort\":$PORT}]}}"

      - name: Set CORS allowed origins per environment
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          if [ "$NS" = "production" ]; then
            ORIGINS="http://localhost,http://3.105.159.125:31690,https://agri-trace.online"
            FRONTEND_URL="https://agri-trace.online"
          else
            ORIGINS="http://localhost,http://3.105.159.125:31691,https://staging.agri-trace.online"
            FRONTEND_URL="https://staging.agri-trace.online"
          fi
          kubectl -n "$NS" patch configmap backend-config -p "{\"data\":{\"ALLOWED_ORIGINS\":\"$ORIGINS\",\"FRONTEND_URL\":\"$FRONTEND_URL\"}}"

      - name: Set database name per environment
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          if [ "$NS" = "staging" ]; then
            DB_NAME="nguongocso_staging_db"
          else
            DB_NAME="nguongocso_db"
          fi
          kubectl -n "$NS" patch configmap backend-config -p "{\"data\":{\"DB_NAME\":\"$DB_NAME\"}}"

      - name: Apply Ingress per environment
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          if [ "$NS" = "production" ]; then
            kubectl apply -f k8s/ingress.yaml -n "$NS"
          else
            kubectl apply -f k8s/ingress-staging.yaml -n "$NS"
          fi

      - name: Apply MySQL (if using in-cluster)
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          if [ -f k8s/mysql.yaml ]; then
            kubectl apply -f k8s/mysql.yaml -n "$NS"
          fi

      - name: Restart deployments
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl rollout restart deployment/backend -n "$NS"
          kubectl rollout restart deployment/frontend -n "$NS"

      # TC-04: record what/why/when for `kubectl rollout history` / describe.
      - name: Annotate deployments with change cause (TC-04)
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          CAUSE="deploy commit ${GITHUB_SHA} via GitHub Actions run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          kubectl -n "$NS" annotate deployment/backend kubernetes.io/change-cause="$CAUSE" --overwrite
          kubectl -n "$NS" annotate deployment/frontend kubernetes.io/change-cause="$CAUSE" --overwrite

      - name: Verify rollout
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl -n "$NS" rollout status deployment/backend --timeout=180s
          kubectl -n "$NS" rollout status deployment/frontend --timeout=180s

      # TC-04: Create Git annotated tag on main branch production releases.
      # Tag points to the exact commit being released.
      - name: Create Git tag on main (TC-04)
        if: github.ref == 'refs/heads/main'
        run: |
          TAG="v${{ env.RELEASE_VERSION }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Git Tag          : $TAG"
          echo "Tag Commit       : $(git rev-list -n 1 $TAG)"

      # TC-04: emit the Release Version -> Git Tag -> Git Commit -> Docker Image
      # -> Kubernetes Deployment -> Deployment Time chain into the CI log.
      # No secrets are printed (namespace name and credentials are never echoed).
      - name: Collect release & deployment evidence (TC-04)
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          ENV_NAME="${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}"
          BACKEND_IMAGE="$(kubectl -n "$NS" get deployment backend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          FRONTEND_IMAGE="$(kubectl -n "$NS" get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          BACKEND_ROLLOUT_TIME="$(kubectl -n "$NS" get pods -l app=backend -o jsonpath='{.items[0].metadata.creationTimestamp}')"
          FRONTEND_ROLLOUT_TIME="$(kubectl -n "$NS" get pods -l app=frontend -o jsonpath='{.items[0].metadata.creationTimestamp}')"
          echo "===================================================================="
          echo " RELEASE & DEPLOYMENT TRACEABILITY"
          echo "===================================================================="
          echo "Release Version  : ${{ env.RELEASE_VERSION }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Git Tag          : v${{ env.RELEASE_VERSION }}"
          else
            echo "Git Tag          : (none — staging)"
          fi
          echo "Git Commit       : ${GITHUB_SHA}"
          echo ""
          echo "Environment      : ${ENV_NAME}"
          echo ""
          echo "Backend Image    : ${BACKEND_IMAGE}"
          echo "Frontend Image   : ${FRONTEND_IMAGE}"
          echo ""
          echo "Deployment Time  : ${BACKEND_ROLLOUT_TIME} (UTC — backend pod creationTimestamp)"
          echo "Frontend Rollout : ${FRONTEND_ROLLOUT_TIME} (UTC)"
          echo ""
          echo "Workflow Run     : #${{ github.run_number }}"
          echo "Workflow Run ID  : ${{ github.run_id }}"
          echo "Workflow URL     : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo ""
          echo "Status           : SUCCESS"
          echo "===================================================================="

      # TC-04: Validate traceability consistency — fail CI on mismatch.
      # Checks: Git tag -> commit, commit -> Docker image, image -> K8s running.
      - name: Validate traceability consistency (TC-04)
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          echo "=== TC-04 Traceability Validation ==="

          # 1. Git tag -> commit (only on main)
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG="v${{ env.RELEASE_VERSION }}"
            TAG_COMMIT="$(git rev-list -n 1 "$TAG" 2>/dev/null || echo "NONE")"
            if [ "$TAG_COMMIT" != "${GITHUB_SHA}" ]; then
              echo "FAIL: Git tag $TAG -> $TAG_COMMIT does not match GITHUB_SHA ${GITHUB_SHA}"
              exit 1
            fi
            echo "PASS: Git tag $TAG -> commit ${GITHUB_SHA}"
          fi

          # 2. GITHUB_SHA -> Docker image tag
          BACKEND_IMAGE="$(kubectl -n "$NS" get deployment backend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          FRONTEND_IMAGE="$(kubectl -n "$NS" get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          if [[ "$BACKEND_IMAGE" != *":${GITHUB_SHA}" ]]; then
            echo "FAIL: Backend image ${BACKEND_IMAGE} does not use commit SHA ${GITHUB_SHA}"
            exit 1
          fi
          if [[ "$FRONTEND_IMAGE" != *":${GITHUB_SHA}" ]]; then
            echo "FAIL: Frontend image ${FRONTEND_IMAGE} does not use commit SHA ${GITHUB_SHA}"
            exit 1
          fi
          echo "PASS: Docker images use commit SHA ${GITHUB_SHA}"

          # 3. Release version -> K8s labels
          K8S_VERSION="$(kubectl -n "$NS" get deployment backend -o jsonpath='{.metadata.labels.release-version}')"
          if [ "$K8S_VERSION" != "${{ env.RELEASE_VERSION }}" ]; then
            echo "FAIL: K8s release-version label ${K8S_VERSION} != ${{ env.RELEASE_VERSION }}"
            exit 1
          fi
          echo "PASS: K8s release-version label = ${{ env.RELEASE_VERSION }}"

          # 4. Git commit -> K8s labels
          K8S_COMMIT="$(kubectl -n "$NS" get deployment backend -o jsonpath='{.metadata.labels.git-commit}')"
          if [ "$K8S_COMMIT" != "${GITHUB_SHA}" ]; then
            echo "FAIL: K8s git-commit label ${K8S_COMMIT} != ${GITHUB_SHA}"
            exit 1
          fi
          echo "PASS: K8s git-commit label = ${GITHUB_SHA}"

          echo "=== TC-04 All traceability checks PASSED ==="