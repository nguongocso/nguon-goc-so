name: CI/CD

on:
  push:
    branches:
      - develop
      - main
      - test/cicd
  pull_request:
    branches:
      - develop
      - main
      - test/cicd
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/nguongocso-backend
  FRONTEND_IMAGE: ${{ github.repository_owner }}/nguongocso-frontend

jobs:
  # ==========================================================
  # BACKEND - TEST
  # ==========================================================
  backend-test:
    name: Backend - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw clean test

  # ==========================================================
  # FRONTEND - LINT + BUILD
  # ==========================================================
  frontend-build:
    name: Frontend - Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # ==========================================================
  # BUILD + PUSH IMAGES
  # ==========================================================
  build-push:
    name: Build & Push Images
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
  # ==========================================================
  # DEPLOY TO KUBERNETES
  # ==========================================================
  deploy:
    name: Deploy to Kubernetes
    needs: build-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Kubeconfig from secrets
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBECONFIG_B64}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Test Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Replace image tags with built version
        run: |
          sed -i "s|image: ghcr.io/nguongocso/nguongocso-backend:.*|image: ghcr.io/nguongocso/nguongocso-backend:${{ needs.build-push.outputs.image_tag }}|g" k8s/backend-deployment.yaml
          sed -i "s|image: ghcr.io/nguongocso/nguongocso-frontend:.*|image: ghcr.io/nguongocso/nguongocso-frontend:${{ needs.build-push.outputs.image_tag }}|g" k8s/frontend-deployment.yaml

      - name: Apply Kubernetes manifests
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secrets.yaml -n "$NS"
          kubectl apply -f k8s/configmap.yaml -n "$NS"
          kubectl apply -f k8s/persistent-volumes.yaml -n "$NS"
          kubectl apply -f k8s/backend-service.yaml -n "$NS"
          kubectl apply -f k8s/backend-deployment.yaml -n "$NS"
          kubectl apply -f k8s/frontend-service.yaml -n "$NS"
          kubectl apply -f k8s/frontend-deployment.yaml -n "$NS"
          # NOTE: k8s/ingress.yaml is intentionally NOT applied here.
          # Staging and production are exposed via NodePort (31691/31690),
          # and applying the same host in two namespaces would collide.

      - name: Set frontend NodePort per environment
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          if [ "$NS" = "production" ]; then
            PORT=31690
          else
            PORT=31691
          fi
          kubectl -n "$NS" patch svc frontend-service -p "{\"spec\":{\"ports\":[{\"port\":80,\"nodePort\":$PORT}]}}"

      - name: Set CORS allowed origins per environment
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          if [ "$NS" = "production" ]; then
            ORIGINS="http://localhost,http://3.106.186.33:31690,https://nguongocso.example.com"
          else
            ORIGINS="http://localhost,http://3.106.186.33:31691,https://staging.nguongocso.example.com"
          fi
          kubectl -n "$NS" patch configmap backend-config -p "{\"data\":{\"ALLOWED_ORIGINS\":\"$ORIGINS\"}}"

      - name: Apply MySQL (if using in-cluster)
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          if [ -f k8s/mysql.yaml ]; then
            kubectl apply -f k8s/mysql.yaml -n "$NS"
          fi

      - name: Restart deployments
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl rollout restart deployment/backend -n "$NS"
          kubectl rollout restart deployment/frontend -n "$NS"

      - name: Verify rollout
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl -n "$NS" rollout status deployment/backend --timeout=180s
          kubectl -n "$NS" rollout status deployment/frontend --timeout=180s