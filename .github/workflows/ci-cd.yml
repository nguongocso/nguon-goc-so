name: CI/CD

on:
  push:
    branches:
      - develop
      - main
      - test/cicd
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - main
      - test/cicd
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      release_version:
        description: "Release version (e.g. 1.1.0). Required for production deployment."
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/nguongocso-backend
  FRONTEND_IMAGE: ${{ github.repository_owner }}/nguongocso-frontend

jobs:
  # ==========================================================
  # PREPARE RELEASE METADATA
  # ==========================================================
  prepare-release:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.determine-version.outputs.release-version }}
      is-production: ${{ steps.determine-version.outputs.is-production }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version and type
        id: determine-version
        run: |
          RELEASE_VERSION=""
          IS_PRODUCTION="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.environment }}" = "production" ] && [ -n "${{ github.event.inputs.release_version }}" ]; then
              RELEASE_VERSION="${{ github.event.inputs.release_version }}"
              IS_PRODUCTION="true"
              echo "Production release triggered manually with version ${RELEASE_VERSION}"
            else
              RELEASE_VERSION="${{ github.event.inputs.release_version || '0.0.0-staging' }}"
              IS_PRODUCTION="false"
              echo "Staging deployment with version ${RELEASE_VERSION}"
            fi
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -qiE "Merge pull request.*from.*(release|hotfix)/v[0-9]+\\.[0-9]+\\.[0-9]+"; then
              if echo "$COMMIT_MSG" | grep -oiE "(release|hotfix)/v[0-9]+\\.[0-9]+\\.[0-9]+" | head -1 | grep -oiE "v[0-9]+\\.[0-9]+\\.[0-9]+" > /dev/null; then
                RELEASE_VERSION=$(echo "$COMMIT_MSG" | grep -oiE "(release|hotfix)/v[0-9]+\\.[0-9]+\\.[0-9]+" | head -1 | sed 's/.*\\/v//')
                IS_PRODUCTION="true"
                echo "Production release detected from merge: version ${RELEASE_VERSION}"
              fi
            else
              RELEASE_VERSION="0.0.0-maintenance"
              IS_PRODUCTION="false"
              echo "Normal main commit detected - not a production release"
            fi
          elif [[ "${{ github.ref }}" =~ ^refs/heads/release/v[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
            RELEASE_VERSION=$(echo "${{ github.ref }}" | sed 's|.*/v||')
            IS_PRODUCTION="false"
            echo "Release branch push: version ${RELEASE_VERSION} (staging)"
          elif [[ "${{ github.ref }}" =~ ^refs/heads/hotfix/v[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
            RELEASE_VERSION=$(echo "${{ github.ref }}" | sed 's|.*/v||')
            IS_PRODUCTION="false"
            echo "Hotfix branch push: version ${RELEASE_VERSION} (staging)"
          else
            RELEASE_VERSION="0.0.0-staging"
            IS_PRODUCTION="false"
            echo "Non-release branch: version ${RELEASE_VERSION}"
          fi

          echo "release-version=${RELEASE_VERSION}" >> $GITHUB_OUTPUT
          echo "is-production=${IS_PRODUCTION}" >> $GITHUB_OUTPUT
          echo "Release Version: ${RELEASE_VERSION}"
          echo "Is Production: ${IS_PRODUCTION}"

  # ==========================================================
  # BACKEND - TEST
  # ==========================================================
  backend-test:
    name: Backend - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw clean test -Dgit.commit=${{ github.sha }}

  # ==========================================================
  # FRONTEND - LINT + BUILD
  # ==========================================================
  frontend-build:
    name: Frontend - Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # ==========================================================
  # BUILD + PUSH IMAGES
  # ==========================================================
  build-push:
    name: Build & Push Images
    needs: [backend-test, frontend-build, prepare-release]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release-version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG="production"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            TAG="develop"
          else
            TAG="edge"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Using mutable tag: ${TAG}"

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ==========================================================
  # DEPLOY TO KUBERNETES - STAGING
  # ==========================================================
  deploy-staging:
    name: Deploy to Staging
    needs: [build-push, prepare-release]
    if: |
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release-version }}
    environment:
      name: staging
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Kubeconfig from secrets
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBECONFIG_B64}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Test Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Set immutable commit-SHA images + release labels (TC-04)
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          sed -i "s|image: ghcr.io/nguongocso/nguongocso-backend:.*|image: ghcr.io/nguongocso/nguongocso-backend:${{ github.sha }}|g" k8s/backend-deployment.yaml
          sed -i "s|image: ghcr.io/nguongocso/nguongocso-frontend:.*|image: ghcr.io/nguongocso/nguongocso-frontend:${{ github.sha }}|g" k8s/frontend-deployment.yaml
          sed -i "s|release-version: \".*\"|release-version: \"${{ env.RELEASE_VERSION }}\"|g" k8s/backend-deployment.yaml
          sed -i "s|git-commit: \".*\"|git-commit: \"${{ github.sha }}\"|g" k8s/backend-deployment.yaml
          sed -i "s|release-version: \".*\"|release-version: \"${{ env.RELEASE_VERSION }}\"|g" k8s/frontend-deployment.yaml
          sed -i "s|git-commit: \".*\"|git-commit: \"${{ github.sha }}\"|g" k8s/frontend-deployment.yaml

      - name: Deploy to Kubernetes Staging
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl apply -f k8s/namespace.yaml -n "$NS" 2>/dev/null || true
          kubectl apply -f k8s/configmap.yaml -n "$NS" 2>/dev/null || true
          kubectl apply -f k8s/secret.yaml -n "$NS" 2>/dev/null || true
          kubectl apply -f k8s/pvc.yaml -n "$NS" 2>/dev/null || true
          kubectl apply -f k8s/mysql.yaml -n "$NS" 2>/dev/null || true
          kubectl apply -f k8s/backend-service.yaml -n "$NS"
          kubectl apply -f k8s/backend-deployment.yaml -n "$NS"
          kubectl apply -f k8s/frontend-service.yaml -n "$NS"
          kubectl apply -f k8s/frontend-deployment.yaml -n "$NS"
          kubectl apply -f k8s/ingress-staging.yaml -n "$NS" 2>/dev/null || true

      - name: Set frontend NodePort for staging
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl -n "$NS" patch svc frontend-service -p '{"spec":{"ports":[{"port":80,"nodePort":31691}]}}'

      - name: Set CORS allowed origins for staging
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          ORIGINS="http://localhost,http://3.105.159.125:31691,https://staging.agri-trace.online"
          FRONTEND_URL="https://staging.agri-trace.online"
          kubectl -n "$NS" patch configmap backend-config -p "{\"data\":{\"ALLOWED_ORIGINS\":\"$ORIGINS\",\"FRONTEND_URL\":\"$FRONTEND_URL\"}}"

      - name: Set database name and environment configuration for staging
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl -n "$NS" patch configmap backend-config -p '{"data":{"DB_NAME":"nguongocso_staging_db","SPRING_PROFILES_ACTIVE":"staging","SPRING_FLYWAY_LOCATIONS":"classpath:db/migration/schema,classpath:db/migration/data,classpath:db/migration-test/data"}}'

      - name: Restart deployments
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl rollout restart deployment/backend -n "$NS"
          kubectl rollout restart deployment/frontend -n "$NS"

      - name: Annotate deployments with change cause
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          CAUSE="staging deploy commit ${GITHUB_SHA} via GitHub Actions run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          kubectl -n "$NS" annotate deployment/backend kubernetes.io/change-cause="$CAUSE" --overwrite
          kubectl -n "$NS" annotate deployment/frontend kubernetes.io/change-cause="$CAUSE" --overwrite

      - name: Verify rollout
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl -n "$NS" rollout status deployment/backend --timeout=180s
          kubectl -n "$NS" rollout status deployment/frontend --timeout=180s

      - name: Collect staging deployment evidence
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          BACKEND_IMAGE="$(kubectl -n "$NS" get deployment backend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          FRONTEND_IMAGE="$(kubectl -n "$NS" get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "===================================================================="
          echo " STAGING DEPLOYMENT"
          echo "===================================================================="
          echo ""
          echo "Release Version  : ${{ env.RELEASE_VERSION }}"
          echo "Git Commit       : ${GITHUB_SHA}"
          echo "Environment      : staging"
          echo ""
          echo "Backend Image    : ${BACKEND_IMAGE}"
          echo "Frontend Image   : ${FRONTEND_IMAGE}"
          echo ""
          echo "Workflow Run     : #${{ github.run_number }}"
          echo "Workflow Run ID  : ${{ github.run_id }}"
          echo "===================================================================="

  # ==========================================================
  # DEPLOY TO KUBERNETES - PRODUCTION
  # ==========================================================
  deploy-production:
    name: Deploy to Production
    needs: [build-push, prepare-release]
    if: needs.prepare-release.outputs.is-production == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release-version }}
    environment:
      name: production
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Kubeconfig from secrets
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBECONFIG_B64}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Test Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # TC-04: Validate tag BEFORE deployment — fail fast if tag issue detected
      - name: Pre-deployment tag validation (TC-04)
        run: |
          TAG="v${{ env.RELEASE_VERSION }}"
          echo "Validating tag ${TAG} before production deployment..."
          git fetch origin --tags 2>/dev/null || true
          EXISTING_COMMIT="$(git rev-list -n 1 "$TAG" 2>/dev/null || echo "")"
          if [ -n "$EXISTING_COMMIT" ]; then
            echo "Tag ${TAG} already exists at commit ${EXISTING_COMMIT}"
            if [ "$EXISTING_COMMIT" = "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already points to current commit ${GITHUB_SHA} — OK to proceed"
            else
              echo "FAIL: Tag ${TAG} exists at ${EXISTING_COMMIT} which differs from ${GITHUB_SHA}"
              echo "Cannot overwrite existing release tag. Use a new release version."
              exit 1
            fi
          else
            echo "Tag ${TAG} does not exist — will be created"
          fi

      - name: Set immutable commit-SHA images + release labels (TC-04)
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          sed -i "s|image: ghcr.io/nguongocso/nguongocso-backend:.*|image: ghcr.io/nguongocso/nguongocso-backend:${{ github.sha }}|g" k8s/backend-deployment.yaml
          sed -i "s|image: ghcr.io/nguongocso/nguongocso-frontend:.*|image: ghcr.io/nguongocso/nguongocso-frontend:${{ github.sha }}|g" k8s/frontend-deployment.yaml
          sed -i "s|release-version: \".*\"|release-version: \"${{ env.RELEASE_VERSION }}\"|g" k8s/backend-deployment.yaml
          sed -i "s|git-commit: \".*\"|git-commit: \"${{ github.sha }}\"|g" k8s/backend-deployment.yaml
          sed -i "s|release-version: \".*\"|release-version: \"${{ env.RELEASE_VERSION }}\"|g" k8s/frontend-deployment.yaml
          sed -i "s|git-commit: \".*\"|git-commit: \"${{ github.sha }}\"|g" k8s/frontend-deployment.yaml

      - name: Deploy to Kubernetes Production
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl apply -f k8s/namespace.yaml -n "$NS" 2>/dev/null || true
          kubectl apply -f k8s/configmap.yaml -n "$NS" 2>/dev/null || true
          kubectl apply -f k8s/secret.yaml -n "$NS" 2>/dev/null || true
          kubectl apply -f k8s/pvc.yaml -n "$NS" 2>/dev/null || true
          kubectl apply -f k8s/mysql.yaml -n "$NS" 2>/dev/null || true
          kubectl apply -f k8s/backend-service.yaml -n "$NS"
          kubectl apply -f k8s/backend-deployment.yaml -n "$NS"
          kubectl apply -f k8s/frontend-service.yaml -n "$NS"
          kubectl apply -f k8s/frontend-deployment.yaml -n "$NS"
          kubectl apply -f k8s/ingress.yaml -n "$NS" 2>/dev/null || true

      - name: Set frontend NodePort for production
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl -n "$NS" patch svc frontend-service -p '{"spec":{"ports":[{"port":80,"nodePort":31690}]}}'

      - name: Set CORS allowed origins for production
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          ORIGINS="http://localhost,http://3.105.159.125:31690,https://agri-trace.online"
          FRONTEND_URL="https://agri-trace.online"
          kubectl -n "$NS" patch configmap backend-config -p "{\"data\":{\"ALLOWED_ORIGINS\":\"$ORIGINS\",\"FRONTEND_URL\":\"$FRONTEND_URL\"}}"

      - name: Set database name and environment configuration for production
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl -n "$NS" patch configmap backend-config -p '{"data":{"DB_NAME":"nguongocso_db","SPRING_PROFILES_ACTIVE":"prod","SPRING_FLYWAY_LOCATIONS":"classpath:db/migration/schema,classpath:db/migration/data"}}'

      - name: Restart deployments
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl rollout restart deployment/backend -n "$NS"
          kubectl rollout restart deployment/frontend -n "$NS"

      - name: Annotate deployments with change cause (TC-04)
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          CAUSE="production release v${{ env.RELEASE_VERSION }} commit ${{ github.sha }} via GitHub Actions run ${{ github.run_id }}"
          kubectl -n "$NS" annotate deployment/backend kubernetes.io/change-cause="$CAUSE" --overwrite
          kubectl -n "$NS" annotate deployment/frontend kubernetes.io/change-cause="$CAUSE" --overwrite

      - name: Verify rollout
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          kubectl -n "$NS" rollout status deployment/backend --timeout=180s
          kubectl -n "$NS" rollout status deployment/frontend --timeout=180s

      # TC-04: Create Git annotated tag — FAIL SAFE (idempotent, never overwrites)
      - name: Create Git tag (TC-04)
        run: |
          TAG="v${{ env.RELEASE_VERSION }}"
          echo "Creating tag ${TAG} for commit ${GITHUB_SHA}..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EXISTING_COMMIT="$(git rev-list -n 1 "$TAG" 2>/dev/null || echo "")"
          if [ -n "$EXISTING_COMMIT" ]; then
            if [ "$EXISTING_COMMIT" = "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already exists at current commit — skipping creation"
            else
              echo "ERROR: Tag ${TAG} already exists at ${EXISTING_COMMIT}"
              echo "Refusing to overwrite. This should have been caught in pre-deployment validation."
              exit 1
            fi
          else
            git tag -a "$TAG" -m "Release $TAG" "${GITHUB_SHA}"
            git push origin "$TAG"
            echo "Created and pushed tag ${TAG}"
          fi
          echo "Git Tag          : $TAG"
          echo "Tag Commit       : $(git rev-list -n 1 $TAG)"

      - name: Collect release & deployment evidence (TC-04)
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          BACKEND_IMAGE="$(kubectl -n "$NS" get deployment backend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          FRONTEND_IMAGE="$(kubectl -n "$NS" get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          BACKEND_ROLLOUT_TIME="$(kubectl -n "$NS" get pods -l app=backend -o jsonpath='{.items[0].metadata.creationTimestamp}')"
          FRONTEND_ROLLOUT_TIME="$(kubectl -n "$NS" get pods -l app=frontend -o jsonpath='{.items[0].metadata.creationTimestamp}')"
          echo "===================================================================="
          echo " RELEASE & DEPLOYMENT TRACEABILITY"
          echo "===================================================================="
          echo ""
          echo "Release Version  : ${{ env.RELEASE_VERSION }}"
          echo "Git Tag          : v${{ env.RELEASE_VERSION }}"
          echo "Git Commit       : ${GITHUB_SHA}"
          echo ""
          echo "Environment      : production"
          echo ""
          echo "Backend Image    : ${BACKEND_IMAGE}"
          echo "Frontend Image   : ${FRONTEND_IMAGE}"
          echo ""
          echo "Deployment Time  : ${BACKEND_ROLLOUT_TIME} (UTC — backend pod creationTimestamp)"
          echo "Frontend Rollout : ${FRONTEND_ROLLOUT_TIME} (UTC)"
          echo ""
          echo "Workflow Run     : #${{ github.run_number }}"
          echo "Workflow Run ID  : ${{ github.run_id }}"
          echo "Workflow URL     : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo ""
          echo "Status           : SUCCESS"
          echo "===================================================================="

      # TC-04: Validate traceability consistency — fail CI on mismatch.
      - name: Validate traceability consistency (TC-04)
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NS="${KUBE_NAMESPACE:-nguongocso}"
          echo "=== TC-04 Traceability Validation ==="

          # 1. Git tag -> commit
          TAG="v${{ env.RELEASE_VERSION }}"
          TAG_COMMIT="$(git rev-list -n 1 "$TAG" 2>/dev/null || echo "NONE")"
          if [ "$TAG_COMMIT" != "${GITHUB_SHA}" ]; then
            echo "FAIL: Git tag $TAG -> $TAG_COMMIT does not match GITHUB_SHA ${GITHUB_SHA}"
            exit 1
          fi
          echo "PASS: Git tag $TAG -> commit ${GITHUB_SHA}"

          # 2. GITHUB_SHA -> Docker image tag
          BACKEND_IMAGE="$(kubectl -n "$NS" get deployment backend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          FRONTEND_IMAGE="$(kubectl -n "$NS" get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          if [[ "$BACKEND_IMAGE" != *":${GITHUB_SHA}" ]]; then
            echo "FAIL: Backend image ${BACKEND_IMAGE} does not use commit SHA ${GITHUB_SHA}"
            exit 1
          fi
          if [[ "$FRONTEND_IMAGE" != *":${GITHUB_SHA}" ]]; then
            echo "FAIL: Frontend image ${FRONTEND_IMAGE} does not use commit SHA ${GITHUB_SHA}"
            exit 1
          fi
          echo "PASS: Docker images use commit SHA ${GITHUB_SHA}"

          # 3. Release version -> K8s labels
          K8S_VERSION="$(kubectl -n "$NS" get deployment backend -o jsonpath='{.metadata.labels.release-version}')"
          if [ "$K8S_VERSION" != "${{ env.RELEASE_VERSION }}" ]; then
            echo "FAIL: K8s release-version label ${K8S_VERSION} != ${{ env.RELEASE_VERSION }}"
            exit 1
          fi
          echo "PASS: K8s release-version label = ${{ env.RELEASE_VERSION }}"

          # 4. Git commit -> K8s labels
          K8S_COMMIT="$(kubectl -n "$NS" get deployment backend -o jsonpath='{.metadata.labels.git-commit}')"
          if [ "$K8S_COMMIT" != "${GITHUB_SHA}" ]; then
            echo "FAIL: K8s git-commit label ${K8S_COMMIT} != ${GITHUB_SHA}"
            exit 1
          fi
          echo "PASS: K8s git-commit label = ${GITHUB_SHA}"

          echo "=== TC-04 All traceability checks PASSED ==="
