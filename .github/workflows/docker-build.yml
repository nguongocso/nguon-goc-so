name: Docker Build

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: nguon_goc_so
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: root
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run backend tests
        continue-on-error: true
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: nguon_goc_so
          DB_USERNAME: root
          DB_PASSWORD: root
        run: ./mvnw -q test

  build:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            IMAGE_TAGS="${TAG},latest"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            IMAGE_TAGS="latest,sha-${SHA_SHORT}"
          else
            IMAGE_TAGS="${GITHUB_REF_NAME},sha-${SHA_SHORT}"
          fi
          echo "image_tags=${IMAGE_TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/nguongocso/nguon-goc-so/backend:${{ steps.meta.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: VITE_API_BASE_URL=/api/v1
          push: true
          tags: ghcr.io/nguongocso/nguon-goc-so/frontend:${{ steps.meta.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
