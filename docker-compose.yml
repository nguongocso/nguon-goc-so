services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${MYSQL_HOST_PORT}:${MYSQL_CONTAINER_PORT}"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        m2repo: ~/.m2

    restart: on-failure:5

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      PORT: ${PORT}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

      UPLOAD_BASE_DIR: ${UPLOAD_BASE_DIR}
      UPLOAD_FARM_LOG_RELATIVE_PATH: ${UPLOAD_FARM_LOG_RELATIVE_PATH}
      UPLOAD_FARM_LOG_MAX_SIZE: ${UPLOAD_FARM_LOG_MAX_SIZE}
      UPLOAD_INSPECTION_RESULT_RELATIVE_PATH: ${UPLOAD_INSPECTION_RESULT_RELATIVE_PATH:-inspection-results}
      UPLOAD_INSPECTION_RESULT_MAX_SIZE: ${UPLOAD_INSPECTION_RESULT_MAX_SIZE:-5242880}
      FARM_AREA_BOUNDARY_DEVIATION_THRESHOLD_PERCENT: ${FARM_AREA_BOUNDARY_DEVIATION_THRESHOLD_PERCENT:-30.0}
      UPLOAD_CERTIFICATION_RELATIVE_PATH: ${UPLOAD_CERTIFICATION_RELATIVE_PATH:-certifications}
      UPLOAD_CERTIFICATION_MAX_SIZE: ${UPLOAD_CERTIFICATION_MAX_SIZE:-5242880}

      QR_IMAGE_STORAGE_PATH: ${QR_IMAGE_STORAGE_PATH}

      MYSQL_DUMP_PATH: ${MYSQL_DUMP_PATH}
      MYSQL_PATH: ${MYSQL_PATH}

      FRONTEND_URL: ${FRONTEND_URL}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      LOCATIONIQ_API_KEY: ${LOCATIONIQ_API_KEY}
      LOCATIONIQ_BASE_URL: ${LOCATIONIQ_BASE_URL}

      # Cấu hình AI Assistant (Google Gemini)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash,gemini-3.6-flash,gemini-3.7-flash,gemini-3.8-flash,gemini-3.5-flash-lite}

      # Múi giờ nghiệp vụ (mặc định Asia/Ho_Chi_Minh). Dùng chung cho Clock
      # nghiệp vụ (app.timezone) và múi giờ mặc định của JVM.qw
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}

      ACTIVITY_LOG_EXPORT_DIRECT_LIMIT: ${ACTIVITY_LOG_EXPORT_DIRECT_LIMIT:-10000}
      ACTIVITY_LOG_EXPORT_MAX_RANGE_DAYS: ${ACTIVITY_LOG_EXPORT_MAX_RANGE_DAYS:-365}
      ACTIVITY_LOG_EXPORT_STORAGE_DIR: ${ACTIVITY_LOG_EXPORT_STORAGE_DIR:-/app/uploads/activity-log-exports}
      ACTIVITY_LOG_EXPORT_RECOVERY_INTERVAL_MS: ${ACTIVITY_LOG_EXPORT_RECOVERY_INTERVAL_MS:-30000}
      ACTIVITY_LOG_EXPORT_LEASE_SECONDS: ${ACTIVITY_LOG_EXPORT_LEASE_SECONDS:-300}
      ACTIVITY_LOG_EXPORT_RECOVERY_BATCH_SIZE: ${ACTIVITY_LOG_EXPORT_RECOVERY_BATCH_SIZE:-20}

      JAVA_OPTS: ${JAVA_OPTS}

    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - backend_uploads:/app/uploads
      - backend_files:/app/files

    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      API_BASE_URL: ${VITE_API_URL}
      BACKEND_UPSTREAM: http://backend:${BACKEND_CONTAINER_PORT}

    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"

    depends_on:
      - backend

volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME}

  backend_uploads:

  backend_files:
