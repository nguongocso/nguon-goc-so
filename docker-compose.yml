services:

  # =========================================================
  # MYSQL - Database
  # =========================================================
  # NOTE: volume is pinned via `name:` to nguongocso_mysql_data so that
  # recreating the stack (even under a different project name) ALWAYS reuses
  # the existing data directory instead of initializing an empty database.
  mysql:
    image: nguongocso-mysql

    container_name: nguongocso-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nguon_goc_so

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================================================
  # BACKEND - Spring Boot
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: nguongocso-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    # Override DB connection inside the container:
    # "localhost" would point to the container itself, not the mysql service.
    environment:
      DB_HOST: mysql
      DB_PORT: 3306

    ports:
      - "8080:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      mysql:
        condition: service_healthy

  # =========================================================
  # FRONTEND - React / Vite / Nginx
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: nguongocso-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  mysql_data:
    name: nguongocso_mysql_data