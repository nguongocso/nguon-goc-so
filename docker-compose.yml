services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${MYSQL_HOST_PORT}:${MYSQL_CONTAINER_PORT}"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 20


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        # Seed the builder with the host Maven repository (~/.m2) so cold
        # builds only download missing artifacts instead of everything.
        m2repo: ~/.m2

    restart: unless-stopped

    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-nguon_goc_so}
      DB_USERNAME: ${DB_USERNAME:-nguongocso}
      DB_PASSWORD: ${DB_PASSWORD:-root}

      PORT: ${PORT:-8080}

      JWT_SECRET: ${JWT_SECRET:-nguongocso_secret_key_default_for_local_development_2026_very_long_secure_secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

      UPLOAD_BASE_DIR: ${UPLOAD_BASE_DIR:-/app/uploads}
      UPLOAD_FARM_LOG_RELATIVE_PATH: ${UPLOAD_FARM_LOG_RELATIVE_PATH:-farm-logs}
      UPLOAD_FARM_LOG_MAX_SIZE: ${UPLOAD_FARM_LOG_MAX_SIZE:-5242880}

      QR_IMAGE_STORAGE_PATH: ${QR_IMAGE_STORAGE_PATH:-/app/files/qr}

      MYSQL_DUMP_PATH: ${MYSQL_DUMP_PATH:-/usr/bin/mysqldump}
      MYSQL_PATH: ${MYSQL_PATH:-/usr/bin/mysql}

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      LOCATIONIQ_API_KEY: ${LOCATIONIQ_API_KEY}
      LOCATIONIQ_BASE_URL: ${LOCATIONIQ_BASE_URL}

      JAVA_OPTS: ${JAVA_OPTS:-"-Xms256m -Xmx768m"}

    ports:
      - "${BACKEND_HOST_PORT:-8080}:${BACKEND_CONTAINER_PORT:-8080}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - backend_uploads:/app/uploads
      - backend_files:/app/files

    depends_on:
      mysql:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      API_BASE_URL: /api/v1
      BACKEND_UPSTREAM: http://backend:${BACKEND_CONTAINER_PORT:-8080}

    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_CONTAINER_PORT}"

    depends_on:
      - backend


volumes:
  mysql_data:
    name: ${MYSQL_VOLUME_NAME}

  backend_uploads:

  backend_files: