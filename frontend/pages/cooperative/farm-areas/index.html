<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0"
    >

    <title>
        Vùng trồng | Nguồn Gốc Số
    </title>

    <link
        rel="stylesheet"
        href="../../../css/reset.css"
    >

    <link
        rel="stylesheet"
        href="../../../css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../../../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../../../css/layouts/dashboard-layout.css"
    >

    <link
        rel="stylesheet"
        href="../../../css/components/button.css"
    >

    <link
        rel="stylesheet"
        href="../../../css/components/form.css"
    >

    <link
        rel="stylesheet"
        href="../../../css/pages/cooperative/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="../../../css/pages/cooperative/farm-areas.css"
    >

</head>

<body>

    <div class="dashboard-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">
                Nguồn Gốc Số
            </div>

            <nav class="sidebar-menu">

                <a href="/frontend/pages/cooperative/dashboard.html">
                    Bảng điều khiển
                </a>

                <a
                    href="/frontend/pages/cooperative/farm-areas/index.html"
                    class="active"
                >
                    Vùng trồng
                </a>

                <a href="/frontend/pages/cooperative/production-lots/index.html">
                    Lô sản xuất
                </a>

                <a href="/frontend/pages/cooperative/profile.html">
                    Hồ sơ tổ chức
                </a>

            </nav>

            <div
                class="sidebar-user"
                id="sidebarUser"
            >
                <div
                    class="sidebar-user-avatar"
                    id="sidebarUserAvatar"
                ></div>

                <div class="sidebar-user-info">
                    <strong id="sidebarUserName">
                        —
                    </strong>

                    <span id="sidebarUserOrg">
                        —
                    </span>
                </div>
            </div>

        </aside>

        <main class="dashboard-main">

            <header class="dashboard-header">

                <div>
                    <h1>
                        Vùng trồng
                    </h1>

                    <p class="text-muted">
                        Quản lý các vùng trồng thuộc hợp tác xã.
                    </p>
                </div>

                <div class="header-actions">

                    <div
                        class="user-badge"
                        id="headerUserBadge"
                    >
                        <span
                            id="headerUserRole"
                            class="user-role-badge"
                        >
                            —
                        </span>

                        <span id="headerUserName">
                            —
                        </span>

                        <span class="user-org-sep">
                            |
                        </span>

                        <span id="headerUserOrg">
                            —
                        </span>
                    </div>

                    <button
                        id="logoutButton"
                        class="btn btn-secondary"
                        type="button"
                    >
                        Đăng xuất
                    </button>

                </div>

            </header>

            <section class="dashboard-content">

                <!-- Trạng thái đang tải -->
                <div
                    id="loadingState"
                    class="state-container"
                    style="display: none;"
                >
                    <div class="state-icon">
                        <svg
                            width="48"
                            height="48"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <circle
                                cx="12"
                                cy="12"
                                r="10"
                            />

                            <path d="M12 6v6l4 2" />
                        </svg>
                    </div>

                    <p class="state-text">
                        Đang tải...
                    </p>
                </div>

                <!-- Trạng thái lỗi -->
                <div
                    id="errorState"
                    class="state-container"
                    style="display: none;"
                >
                    <div class="state-icon state-error-icon">
                        <svg
                            width="48"
                            height="48"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <circle
                                cx="12"
                                cy="12"
                                r="10"
                            />

                            <line
                                x1="12"
                                y1="8"
                                x2="12"
                                y2="12"
                            />

                            <line
                                x1="12"
                                y1="16"
                                x2="12.01"
                                y2="16"
                            />
                        </svg>
                    </div>

                    <p
                        id="errorMessage"
                        class="state-text state-error-text"
                    >
                        Đã xảy ra lỗi.
                    </p>

                    <button
                        id="retryButton"
                        class="btn btn-secondary"
                        type="button"
                    >
                        Thử lại
                    </button>
                </div>

                <!-- Trạng thái không có quyền -->
                <div
                    id="unauthorizedState"
                    class="state-container"
                    style="display: none;"
                >
                    <div class="state-icon state-error-icon">
                        <svg
                            width="48"
                            height="48"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <rect
                                x="3"
                                y="11"
                                width="18"
                                height="11"
                                rx="2"
                                ry="2"
                            />

                            <path
                                d="M7 11V7a5 5 0 0 1 10 0v4"
                            />
                        </svg>
                    </div>

                    <p class="state-text state-error-text">
                        Bạn không có quyền truy cập trang này.
                    </p>

                    <a
                        href="/frontend/pages/auth/login.html"
                        class="btn btn-secondary"
                    >
                        Quay lại đăng nhập
                    </a>
                </div>

                <!-- Nội dung chính -->
                <div id="mainContent">

                    <!-- Form tạo vùng trồng -->
                    <div class="create-section">

                        <div class="create-section-inner">

                            <div class="create-section-header">
                                <h2>
                                    Thêm vùng trồng
                                </h2>

                                <p class="text-muted">
                                    Nhập các thông tin bên dưới để đăng ký vùng trồng mới.
                                </p>
                            </div>

                            <form
                                id="farmAreaForm"
                                novalidate
                            >

                                <!-- Tên vùng trồng -->
                                <div class="form-group">
                                    <label for="name">
                                        Tên vùng trồng
                                        <span class="required">
                                            *
                                        </span>
                                    </label>

                                    <input
                                        type="text"
                                        id="name"
                                        name="name"
                                        maxlength="255"
                                        autocomplete="off"
                                        aria-describedby="nameError"
                                        aria-invalid="false"
                                        required
                                    >

                                    <small
                                        id="nameError"
                                        class="field-error"
                                        data-error-for="name"
                                    ></small>
                                </div>

                                <!-- Loại cây trồng -->
                                <div class="form-group">
                                    <label for="cropType">
                                        Loại cây trồng
                                        <span class="required">
                                            *
                                        </span>
                                    </label>

                                    <select
                                        id="cropType"
                                        name="cropType"
                                        aria-describedby="cropTypeError"
                                        aria-invalid="false"
                                        required
                                    >
                                        <option value="">
                                            Chọn loại cây trồng
                                        </option>
                                    </select>

                                    <small
                                        id="cropTypeError"
                                        class="field-error"
                                        data-error-for="cropType"
                                    ></small>
                                </div>

                                <!-- Vĩ độ -->
                                <div class="form-group">
                                    <label for="latitude">
                                        Vĩ độ
                                        <span class="required">
                                            *
                                        </span>
                                    </label>

                                    <input
                                        type="number"
                                        id="latitude"
                                        name="latitude"
                                        step="any"
                                        autocomplete="off"
                                        aria-describedby="latitudeError"
                                        aria-invalid="false"
                                        required
                                    >

                                    <small
                                        id="latitudeError"
                                        class="field-error"
                                        data-error-for="latitude"
                                    ></small>
                                </div>

                                <!-- Kinh độ -->
                                <div class="form-group">
                                    <label for="longitude">
                                        Kinh độ
                                        <span class="required">
                                            *
                                        </span>
                                    </label>

                                    <input
                                        type="number"
                                        id="longitude"
                                        name="longitude"
                                        step="any"
                                        autocomplete="off"
                                        aria-describedby="longitudeError"
                                        aria-invalid="false"
                                        required
                                    >

                                    <small
                                        id="longitudeError"
                                        class="field-error"
                                        data-error-for="longitude"
                                    ></small>
                                </div>

                                <!-- Diện tích -->
                                <div class="form-group">
                                    <label for="area">
                                        Diện tích
                                        <span class="required">
                                            *
                                        </span>
                                    </label>

                                    <input
                                        type="number"
                                        id="area"
                                        name="area"
                                        min="0.01"
                                        step="0.01"
                                        autocomplete="off"
                                        aria-describedby="areaError"
                                        aria-invalid="false"
                                        required
                                    >

                                    <small
                                        id="areaError"
                                        class="field-error"
                                        data-error-for="area"
                                    ></small>
                                </div>

                                <!-- Thông báo form -->
                                <div
                                    id="formMessage"
                                    class="form-message"
                                    role="alert"
                                    aria-live="polite"
                                ></div>

                                <!-- Thao tác -->
                                <div class="form-actions">
                                    <button
                                        type="submit"
                                        id="submitButton"
                                        class="btn btn-primary"
                                    >
                                        Tạo vùng trồng
                                    </button>
                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <script
        type="module"
        src="../../../js/pages/cooperative/farm-areas/farm-areas.page.js"
    >
    </script>

</body>

</html>
