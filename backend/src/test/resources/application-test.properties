# =========================================================
# TEST DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/nguon_goc_so_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=nguongocso_test
spring.datasource.password=Dev2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/schema,classpath:db/migration/data


# =========================================================
# LOGGING
# =========================================================

logging.level.root=WARN
logging.level.vn.nguongocso=INFO
logging.level.org.springframework.security=WARN


# =========================================================
# JWT
# =========================================================

app.jwt.secret=test-jwt-secret-key-nguon-goc-so-ci-2026-this-is-not-production-secret
app.jwt.expiration=3600000


# =========================================================
# CORS
# =========================================================

app.cors.allowed-origins=http://localhost:5173


# =========================================================
# UPLOAD
# =========================================================

app.upload.base-dir=target/test-uploads
app.upload.farm-log.relative-path=farm-logs
app.upload.farm-log.max-size=10485760

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =========================================================
# QR CODE
# =========================================================

qr.image.storage.path=target/test-qr


# =========================================================
# MYSQL BACKUP / RESTORE
# =========================================================

app.backup.mysql-dump-path=target/test-backup
app.backup.mysql-path=mysqldump


# =========================================================
# SERVER
# =========================================================

server.port=0


# =========================================================
# FRONTEND
# =========================================================

app.frontend-url=http://localhost:5173


# =========================================================
# MAIL - TEST
# =========================================================

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false


# =========================================================
# LOCATIONIQ - TEST
# =========================================================

locationiq.api-key=test-locationiq-api-key
locationiq.base-url=https://us1.locationiq.com/v1