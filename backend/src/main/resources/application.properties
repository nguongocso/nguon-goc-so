
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:nguon_goc_so}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate: validate only — Flyway is the source of truth for schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway: enabled, scans schema/ first then data/
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/schema,classpath:db/migration/data
# NOTE: The local development DB has V19's schema changes already present (applied
# manually before Flyway was enabled) with existing data, while flyway_schema_history
# only records up to V18. V19 was reconciled as applied (checksum NULL) so Flyway
# proceeds to apply V20 onwards normally.

logging.level.root=INFO
logging.level.vn.nguongocso=INFO
logging.level.org.springframework.security=DEBUG

app.jwt.secret=${JWT_SECRET:nguongocso_secret_key_default_for_local_development_2026_very_long_secure_secret}
app.jwt.expiration=86400000
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

app.upload.base-dir=./uploads
app.upload.farm-log.relative-path=farm-logs
app.upload.farm-log.max-size=5242880
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

qr.image.storage.path=./files/qr

# Đường dẫn đến mysqldump (thay đổi theo máy bạn)
app.backup.mysql-dump-path=C:/xampp/mysql/bin/mysqldump.exe

# Đường dẫn đến mysql (dùng cho restore)
app.backup.mysql-path=C:/xampp/mysql/bin/mysql.exe

# application.properties
server.port=${PORT:8080}

# Frontend URL for Invitation links
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

