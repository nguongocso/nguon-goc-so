# =========================
# DATABASE
# =========================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================
# JPA / HIBERNATE
# =========================
# Hibernate: validate only — Flyway is the source of truth for schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================
# FLYWAY
# =========================
spring.flyway.enabled=true
#spring.flyway.repair-on-migrate=true
spring.flyway.locations=classpath:db/migration/schema,classpath:db/migration/data


# =========================
# LOGGING
# =========================
logging.level.root=INFO
logging.level.vn.nguongocso=INFO
logging.level.org.springframework.security=DEBUG


# =========================
# JWT
# =========================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}


# =========================
# CORS
# =========================
app.cors.allowed-origins=${ALLOWED_ORIGINS}


# =========================
# UPLOAD
# =========================
app.upload.base-dir=${UPLOAD_BASE_DIR}
app.upload.farm-log.relative-path=${UPLOAD_FARM_LOG_RELATIVE_PATH}
app.upload.farm-log.max-size=${UPLOAD_FARM_LOG_MAX_SIZE}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =========================
# QR CODE
# =========================
qr.image.storage.path=${QR_IMAGE_STORAGE_PATH}


# =========================
# MYSQL BACKUP / RESTORE
# =========================
app.backup.mysql-dump-path=${MYSQL_DUMP_PATH}
app.backup.mysql-path=${MYSQL_PATH}


# =========================
# SERVER
# =========================
server.port=${PORT:8080}


# =========================
# FRONTEND
# =========================
app.frontend-url=${FRONTEND_URL}


# =========================
# MAIL - GMAIL SMTP
# =========================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =========================
# LOCATIONIQ
# =========================
locationiq.api-key=${LOCATIONIQ_API_KEY}
locationiq.base-url=${LOCATIONIQ_BASE_URL}


# =========================
# BUSINESS TIME
# =========================
app.timezone=Asia/Ho_Chi_Minh
