spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nguon_goc_so}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 👇 Sửa từ 'validate' thành 'update'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

logging.level.root=INFO
logging.level.vn.nguongocso=INFO
logging.level.org.springframework.security=DEBUG

app.jwt.secret=${JWT_SECRET:Q29uZmlndXJlACB1cTVyTG9uZ1NlY3JldEtleUZvckpXVDI1NkJpdA==}
app.jwt.expiration=86400000

app.upload.base-dir=./uploads
app.upload.farm-log.relative-path=farm-logs
app.upload.farm-log.max-size=5242880
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

qr.image.storage.path=./files/qr