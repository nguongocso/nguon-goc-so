# =========================
# DATABASE
# =========================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool configuration for high-concurrency exports
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000


# =========================
# JPA / HIBERNATE
# =========================
# Hibernate: validate only — Flyway is the source of truth for schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================
# FLYWAY (Base migrations - Default for all environments / Production)
# =========================
spring.flyway.enabled=true
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:db/migration/schema,classpath:db/migration/data


# =========================
# LOGGING
# =========================
logging.level.root=INFO
logging.level.vn.nguongocso=INFO
logging.level.org.springframework.security=INFO


# =========================
# JWT
# =========================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}


# =========================
# CORS
# =========================
app.cors.allowed-origins=${ALLOWED_ORIGINS}


# =========================
# UPLOAD
# =========================
app.upload.base-dir=${UPLOAD_BASE_DIR}
app.upload.farm-log.relative-path=${UPLOAD_FARM_LOG_RELATIVE_PATH}
app.upload.farm-log.max-size=${UPLOAD_FARM_LOG_MAX_SIZE}
app.upload.inspection-result.relative-path=${UPLOAD_INSPECTION_RESULT_RELATIVE_PATH:inspection-results}
app.upload.inspection-result.max-size=${UPLOAD_INSPECTION_RESULT_MAX_SIZE:5242880}
app.upload.avatar.relative-path=${UPLOAD_AVATAR_RELATIVE_PATH:avatars}
app.upload.avatar.max-size=${UPLOAD_AVATAR_MAX_SIZE:5242880}
app.upload.handover.relative-path=${UPLOAD_HANDOVER_RELATIVE_PATH:handovers}
app.upload.handover.max-size=${UPLOAD_HANDOVER_MAX_SIZE:5242880}
app.activity-log-export.direct-limit=${ACTIVITY_LOG_EXPORT_DIRECT_LIMIT:10000}
app.activity-log-export.max-range-days=${ACTIVITY_LOG_EXPORT_MAX_RANGE_DAYS:365}
app.activity-log-export.storage-dir=${ACTIVITY_LOG_EXPORT_STORAGE_DIR:./uploads/activity-log-exports}
app.activity-log-export.recovery-interval-ms=${ACTIVITY_LOG_EXPORT_RECOVERY_INTERVAL_MS:30000}
app.activity-log-export.lease-seconds=${ACTIVITY_LOG_EXPORT_LEASE_SECONDS:300}
app.activity-log-export.recovery-batch-size=${ACTIVITY_LOG_EXPORT_RECOVERY_BATCH_SIZE:20}
app.farm-area.boundary-deviation-threshold-percent=${FARM_AREA_BOUNDARY_DEVIATION_THRESHOLD_PERCENT:30.0}
app.upload.certification.relative-path=${UPLOAD_CERTIFICATION_RELATIVE_PATH:certifications}
app.upload.certification.max-size=${UPLOAD_CERTIFICATION_MAX_SIZE:5242880}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =========================
# QR CODE
# =========================
qr.image.storage.path=${QR_IMAGE_STORAGE_PATH}


# =========================
# MYSQL BACKUP / RESTORE
# =========================
app.backup.mysql-dump-path=${MYSQL_DUMP_PATH:mysqldump}
app.backup.mysql-path=${MYSQL_PATH:mysql}


# =========================
# SERVER
# =========================
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=false
# KHONG dung framework strategy: ForwardedHeaderFilter se tin mu quang
# X-Forwarded-For va ghi de getRemoteAddr(), vo hieu hoa trusted-proxy
# check trong IpUtils va mo lo hong spoofing. De IpUtils tu xu ly
# forwarded headers theo danh sach TRUSTED_PROXY_IPS.
server.forward-headers-strategy=none

# =========================
# LOGIN ANOMALY IP GEOLOCATION
# =========================
app.ip-geolocation.enabled=${IP_GEOLOCATION_ENABLED:true}
app.ip-geolocation.base-url=${IP_GEOLOCATION_BASE_URL:https://ipwho.is}


# =========================
# FRONTEND
# =========================
app.frontend-url=${FRONTEND_URL}


# =========================
# MAIL - GMAIL SMTP
# =========================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =========================
# LOCATIONIQ
# =========================
locationiq.api-key=${LOCATIONIQ_API_KEY}
locationiq.base-url=${LOCATIONIQ_BASE_URL}


# =========================
# ACTUATOR (TC-04)
# =========================
# Expose health + info endpoints over web:
#   /actuator/health → public (SecurityConfig permitAll) — giữ nguyên.
#   /actuator/info   → VẪN yêu cầu JWT (anyRequest().authenticated()) — KHÔNG public.
# /actuator/info trả về build version, build time, git commit từ
# META-INF/build-info.properties (sinh bởi spring-boot-maven-plugin:build-info).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# =========================
# BUSINESS TIME
# =========================
# Múi giờ nghiệp vụ dùng chung cho toàn hệ thống (Clock nghiệp vụ trong
# TimeConfig và múi giờ mặc định của JVM trong BackendApplication).
# Có thể ghi đè bằng biến môi trường APP_TIMEZONE.
app.timezone=${APP_TIMEZONE:Asia/Ho_Chi_Minh}

# =========================
# PARTNER API KEY WARNINGS (NCL-12-CN-005)
# =========================
# Số ngày trước hết hạn thì cảnh báo + cron quét hằng ngày lúc 00:00 theo `app.timezone`
# + tỷ lệ hạn mức/giờ chạm ngưỡng cảnh báo (0.8 = 80%).
# Riêng cảnh báo hạn mức còn có job đối soát gửi bù: quét usage trong ngày và gửi
# cảnh báo cho khóa đã vượt ngưỡng nhưng chưa được cảnh báo (mặc định mỗi giờ, phút 30)
# vì mốc 00:00 là lúc sang ngày mới nên usage của ngày hôm đó bằng 0.
app.apikey.expiry-warning-days=${APIKEY_EXPIRY_WARNING_DAYS:7}
app.apikey.expiry-scan-cron=${APIKEY_EXPIRY_SCAN_CRON:0 0 0 * * ?}
app.apikey.quota-warning-ratio=${APIKEY_QUOTA_WARNING_RATIO:0.8}
app.apikey.quota-scan-cron=${APIKEY_QUOTA_SCAN_CRON:0 30 * * * ?}

# =========================
# AI ASSISTANT (GOOGLE GEMINI)
# =========================
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash,gemini-3.6-flash,gemini-1.5-flash,gemini-2.0-flash}
app.ai.gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
app.ai.gemini.connect-timeout-seconds=5
app.ai.gemini.read-timeout-seconds=20

