# =========================================================
# TEST PROFILE RUNTIME CONFIGURATION (NCL-12-CN-004)
# =========================================================

server.port=8080

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test-init.sql
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false

spring.flyway.enabled=false

logging.level.root=WARN
logging.level.vn.nguongocso=INFO
logging.level.org.springframework.security=WARN

app.jwt.secret=test-jwt-secret-key-nguongocso-ci-2026-this-is-not-production-secret
app.jwt.expiration=3600000

app.cors.allowed-origins=http://localhost:5173

app.upload.base-dir=target/test-uploads
app.upload.certification.relative-path=certifications
app.upload.certification.max-size=5242880
app.upload.farm-log.relative-path=farm-logs
app.upload.farm-log.max-size=10485760
app.upload.inspection-result.relative-path=inspection-results
app.upload.inspection-result.max-size=5242880
app.upload.avatar.relative-path=avatars
app.upload.avatar.max-size=5242880
app.upload.handover.relative-path=handovers
app.upload.handover.max-size=5242880

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

qr.image.storage.path=target/test-qr

app.backup.mysql-dump-path=target/test-backup
app.backup.mysql-path=mysqldump
app.backup.scheduler.enabled=false

app.frontend-url=http://localhost:5173

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

locationiq.api-key=test-locationiq-api-key
locationiq.base-url=https://us1.locationiq.com/v1

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
