# ============================================================
# Non-secret backend configuration
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: nguongocso
data:
  # Database (host/port/name are non-secret; credentials live in the Secret)
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "nguon_goc_so"

  # Server
  PORT: "8080"

  # JWT (secret key lives in the Secret)
  JWT_EXPIRATION: "86400000"

  # CORS — comma-separated list of allowed origins
  ALLOWED_ORIGINS: "http://localhost,https://nguongocso.example.com"

  # Uploads
  UPLOAD_BASE_DIR: "/app/uploads"
  UPLOAD_FARM_LOG_RELATIVE_PATH: "farm-logs"
  UPLOAD_FARM_LOG_MAX_SIZE: "5242880"

  # QR code storage
  QR_IMAGE_STORAGE_PATH: "/app/files/qr"

  # MySQL backup/restore binaries
  MYSQL_DUMP_PATH: "/usr/bin/mysqldump"
  MYSQL_PATH: "/usr/bin/mysql"

  # Frontend URL (used for CORS / links)
  FRONTEND_URL: "https://nguongocso.example.com"

  # Mail (SMTP host/port are non-secret; credentials live in the Secret)
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"

  # LocationIQ
  LOCATIONIQ_BASE_URL: "https://us1.locationiq.com/v1/reverse"