# ============================================================
# Non-secret backend configuration
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  # Database (host/port/name are non-secret; credentials live in the Secret)
  DB_HOST: "database-1.ct2w4qggumqo.ap-southeast-2.rds.amazonaws.com"
  DB_PORT: "3306"
  DB_NAME: "nguongocso_db"

  # Server
  PORT: "8080"

  # JWT (secret key lives in the Secret)
  JWT_EXPIRATION: "86400000"

  # CORS — comma-separated list of allowed origins.
  # The real per-environment value is set by CI/CD after apply:
  #   staging    -> http://3.106.186.33:31691
  #   production -> http://3.106.186.33:31690
  # This default only keeps localhost available locally.
  ALLOWED_ORIGINS: "http://localhost"

  # Uploads
  UPLOAD_BASE_DIR: "/app/uploads"
  UPLOAD_FARM_LOG_RELATIVE_PATH: "farm-logs"
  UPLOAD_FARM_LOG_MAX_SIZE: "5242880"

  # QR code storage
  QR_IMAGE_STORAGE_PATH: "/app/files/qr"

  # MySQL backup/restore binaries
  MYSQL_DUMP_PATH: "/usr/bin/mysqldump"
  MYSQL_PATH: "/usr/bin/mysql"

  # Frontend URL (used for CORS / links)
  FRONTEND_URL: "https://nguongocso.example.com"

  # Mail (SMTP host/port are non-secret; credentials live in the Secret)
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"

  # Disable Spring Boot's mail health indicator. The SMTP credentials are
  # placeholders in the Secret, so the default JavaMailSender health check
  # would otherwise report DOWN and fail liveness/readiness probes.
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"

  # LocationIQ
  LOCATIONIQ_BASE_URL: "https://us1.locationiq.com/v1/reverse"