# ============================================================
# Frontend Deployment
# ------------------------------------------------------------
# Applies to both staging and production namespaces (via -n).
# Image tag is rewritten by CI/CD before apply to the immutable
# commit SHA (github.sha) for release traceability (TC-04).
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    # TC-04: Release metadata — CI/CD overrides these before apply.
    release-version: "1.0.0"
    git-commit: "placeholder"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        # TC-04: Release metadata — CI/CD overrides these before apply.
        release-version: "1.0.0"
        git-commit: "placeholder"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/nguongocso/nguongocso-frontend:placeholder
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            # Same-origin API path served through the nginx reverse proxy.
            - name: API_BASE_URL
              value: "/api/v1"
            # Nginx upstream — internal DNS of the backend Service.
            - name: BACKEND_UPSTREAM
              value: "http://backend-service:8080"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3