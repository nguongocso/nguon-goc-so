# ============================================================
# Backend Deployment
# ------------------------------------------------------------
# Applies to both staging and production namespaces (via -n).
# Image tag is rewritten by CI/CD before apply to the immutable
# commit SHA (github.sha) for release traceability (TC-04).
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    # TC-04: Release metadata — CI/CD overrides these before apply.
    release-version: "1.0.0"
    git-commit: "placeholder"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        # TC-04: Release metadata — CI/CD overrides these before apply.
        release-version: "1.0.0"
        git-commit: "placeholder"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/nguongocso/nguongocso-backend:placeholder
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          # Non-secret configuration from ConfigMap.
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_SECRET
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: MAIL_PASSWORD
            - name: LOCATIONIQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: LOCATIONIQ_API_KEY
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx768m"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1536Mi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: files
              mountPath: /app/files
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads-pvc
        - name: files
          persistentVolumeClaim:
            claimName: backend-files-pvc