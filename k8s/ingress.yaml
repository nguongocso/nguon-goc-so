# ============================================================
# Ingress (production)
# ------------------------------------------------------------
# Host: agri-trace.online
# TLS is auto-provisioned by cert-manager via the letsencrypt-prod
# ClusterIssuer. The frontend nginx reverse-proxies /api and /files
# to backend-service, so external traffic only reaches frontend-service.
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nguongocso-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - agri-trace.online
      secretName: agri-trace-tls
  rules:
    - host: agri-trace.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80